[package]
name = "kubef"
version = "2.2.1"
edition = "2024"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/marcocondrache/kubef"
repository = "https://github.com/marcocondrache/kubef"
categories = ["networking", "k8s", "kubernetes"]
authors = [
    "Marco Mihai Condrache <52580954+marcocondrache@users.noreply.github.com>",
    "Marco Ciotola <McCio@users.noreply.github.com>",
]

[dependencies]
nanoid = "0.5"
futures = "0.3.31"
tracing = "0.1.41"
schemars = "1.0.4"
anyhow = "1.0.100"
either = "1.15.0"
dirs = "6.0"

ipnet = { version = "2.11.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = { version = "0.10" }
clap = { version = "4.5.49", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = [
    "runtime",
    "ws",
    "gzip",
    "unstable-runtime",
    "unstable-client",
] }
strsim = "0.11.1"

[build-dependencies]
schemars = "1.0.4"
serde_json = "1.0.143"
serde = { version = "1.0.228", features = ["derive"] }
ipnet = { version = "2.11.0", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
