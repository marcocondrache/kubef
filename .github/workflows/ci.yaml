name: ci
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  style:
    name: style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check for typos
        uses: crate-ci/typos@b41eb62e9a8096c9ba6636e2365d3f56018a203c # master

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run clippy
        run: cargo clippy --all -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install nextest
        uses: taiki-e/install-action@9252097d36d2d3618ad98f5d873696a962b6897c # nextest
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo nextest run --verbose --no-tests=pass

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  machete:
    name: machete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-machete
        uses: taiki-e/install-action@2e626872fb07d3b9d201c1e410e5aba93d246482 # cargo-machete
      - name: Check unused dependencies
        run: cargo machete

  tests_pass:
    name: tests pass
    needs: [style, clippy, test, docs, machete]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          set +x
          EXIT_CODE=0

          check_result() {
            echo "* $1: $2"
            if [[ "$2" != "skipped" && "$2" != "success" ]]; then EXIT_CODE=1; fi
          }

          check_result "style" "$RESULT_STYLE"
          check_result "clippy" "$RESULT_CLIPPY"
          check_result "test" "$RESULT_TEST"
          check_result "docs" "$RESULT_DOCS"
          check_result "machete" "$RESULT_MACHETE"

          exit $EXIT_CODE
        env:
          RESULT_STYLE: ${{ needs.style.result }}
          RESULT_CLIPPY: ${{ needs.clippy.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_DOCS: ${{ needs.docs.result }}
          RESULT_MACHETE: ${{ needs.machete.result }}
