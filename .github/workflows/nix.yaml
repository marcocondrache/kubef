name: Nix

on:
  push:
    branches:
      - main
  pull_request:
    types: [ labeled ]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    name: Build binary
    if: ${{ github.ref == 'refs/heads/main' || github.event.label.name == 'nix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: nix build
      - run: ./result/bin/kubef help