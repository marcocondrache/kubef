name: Nix

on:
  push:
    branches:
      - main
  pull_request:
    types: [ labeled ]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    name: Build binary
    if: ${{ github.ref == 'refs/heads/main' || github.event.label.name == 'nix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - run: nix build
      - run: ./result/bin/kubef help